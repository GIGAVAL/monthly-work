<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Monthly work · Valerie</title>
<style>
:root {
  --bg:#0b1220; --panel:#121a2b; --line:#243047; --text:#e8eefc; --muted:#93a0b8;
  --open:#f59e0b; --closed:#22c55e; --accent:#60a5fa; --chip:#1a2744;
}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
background:radial-gradient(1100px 500px at 15% -10%,#1a2744 0%,var(--bg) 55%);color:var(--text);padding:32px 20px 64px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 24px;line-height:1.5}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:120px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 8px;margin:0 0 16px}
.card h2{margin:0 0 12px;font-size:16px}
.pr{display:grid;grid-template-columns:72px 1fr;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.pr:first-of-type{border-top:none}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;display:inline-block;width:fit-content}
.badge.open{background:color-mix(in oklab,var(--open) 22%,transparent);color:var(--open)}
.badge.closed{background:color-mix(in oklab,var(--closed) 22%,transparent);color:var(--closed)}
.meta{color:var(--muted);font-size:12px;margin-top:4px}
a.title{color:var(--text);text-decoration:none;font-weight:600}
a.title:hover{color:var(--accent)}
.footer{color:var(--muted);font-size:12px;margin-top:28px}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--muted);margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Monthly work log</h1>
  <p class="sub">Valerie Jimenez — GitHub PR tracker by month. Open a month to see the work plan and every PR.</p>
  <section class="card">
    <h2>Months</h2>
    <div class="pr">
      <div><span class="badge open">LIVE</span></div>
      <div>
        <a class="title" href="2026-09/">September 2026</a>
        <div class="meta">41 PRs · 38 closed · 3 open · repos: internal-dashboard, structured-fullstack, structured-landing</div>
      </div>
    </div>
  </section>
  <p class="footer">Hosted on GitHub Pages from <code>GIGAVAL/monthly-work</code>.</p>
</div>
</body>
</html>
